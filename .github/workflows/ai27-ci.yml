name: AI27 · Verificar build

on:
  push:
    paths: ['ai27-plataforma/**', '.github/workflows/ai27-ci.yml']
  pull_request:
    paths: ['ai27-plataforma/**', '.github/workflows/ai27-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai27-plataforma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai27-plataforma/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ai27-dist
          path: ai27-plataforma/dist
          retention-days: 7
