name: Daily Executive Summary

on:
  schedule:
    # 6pm CDT (UTC-5) = 23:00 UTC — Mon-Fri
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # allow manual run from GitHub UI

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN:      ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TARGET_USER_ID: ${{ secrets.SLACK_TARGET_USER_ID }}
          CIRCLEBACK_API_KEY:   ${{ secrets.CIRCLEBACK_API_KEY }}
          GMAIL_CLIENT_ID:      ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python daily_summary.py
