name: Daily Executive Summary

on:
  schedule:
    # 00:00 UTC = 6:00 PM CST (UTC-6, Mexico City)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Override date (yyyy-mm-dd, optional)'
        required: false
        default: ''

jobs:
  send-summary:
    name: Generate & Send Daily Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send daily summary
        run: python scripts/daily_summary.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN:      ${{ secrets.SLACK_BOT_TOKEN }}
          CIRCLEBACK_API_KEY:   ${{ secrets.CIRCLEBACK_API_KEY }}
          GMAIL_CLIENT_ID:      ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SLACK_TARGET_USER_ID: U02G57N1UDP
