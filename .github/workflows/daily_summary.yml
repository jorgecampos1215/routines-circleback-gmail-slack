name: Daily Executive Summary

on:
  schedule:
    # 6pm CDT = 23:00 UTC  |  6pm CST = 00:00 UTC (next day)
    # Adjust to 00:00 UTC in winter (CST) and 23:00 UTC in summer (CDT)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # allow manual runs

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          SLACK_BOT_TOKEN:      ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID:        ${{ secrets.SLACK_USER_ID }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          CIRCLEBACK_API_KEY:   ${{ secrets.CIRCLEBACK_API_KEY }}
          GMAIL_CLIENT_ID:      ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python daily_summary.py
