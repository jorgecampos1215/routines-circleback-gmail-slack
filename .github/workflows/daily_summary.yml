name: Daily Executive Summary

on:
  schedule:
    # 6:00 PM Mexico City CDT (UTC-5) = 23:00 UTC
    # Runs Mon–Fri; adjust days or remove restriction as needed
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          CIRCLEBACK_API_TOKEN: ${{ secrets.CIRCLEBACK_API_TOKEN }}
          CIRCLEBACK_BASE_URL: ${{ secrets.CIRCLEBACK_BASE_URL }}
        run: python generate_summary.py
