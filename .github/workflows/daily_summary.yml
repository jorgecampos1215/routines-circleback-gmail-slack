name: Resumen Ejecutivo Diario

on:
  schedule:
    # 00:00 UTC = 18:00 CST (Mexico City, UTC-6) — runs every day at 6 pm
    - cron: "0 0 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send daily summary
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_USER_TOKEN:    ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_USER_ID:       ${{ secrets.SLACK_USER_ID }}
          CIRCLEBACK_API_KEY:  ${{ secrets.CIRCLEBACK_API_KEY }}
          GMAIL_TOKEN:         ${{ secrets.GMAIL_TOKEN }}
          GMAIL_USER_EMAIL:    ${{ secrets.GMAIL_USER_EMAIL }}
        run: python daily_summary.py
