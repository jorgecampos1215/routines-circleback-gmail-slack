name: Daily Executive Summary

on:
  schedule:
    # 6pm CST = midnight UTC (UTC-6)
    - cron: "0 0 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          SLACK_BOT_TOKEN:        ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SUMMARY_USER_ID:  ${{ secrets.SLACK_SUMMARY_USER_ID }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          CIRCLEBACK_API_TOKEN:   ${{ secrets.CIRCLEBACK_API_TOKEN }}
          GMAIL_TOKEN_JSON:       ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        run: python daily_summary.py
