name: Daily Executive Summary

on:
  schedule:
    # 6pm CST (UTC-6) / 6pm CDT (UTC-5) → run at both 23:00 and 00:00 UTC,
    # conditioned on local time — GitHub Actions uses UTC.
    # Mexico City observes CDT (UTC-5) Apr–Oct, CST (UTC-6) Nov–Mar.
    # To cover 6pm year-round, we run at 23:00 UTC (covers CDT season, Mar-Nov).
    - cron: '0 23 * * 1-5'   # Mon–Fri 6pm CDT (UTC-5)
    - cron: '0 0 * * 2-6'    # Mon–Fri 6pm CST (UTC-6), fires Tue-Sat at 00:00 UTC
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  generate-and-send-summary:
    runs-on: ubuntu-latest
    # Prevent double-runs: only one schedule will match per season.
    # The workflow_dispatch always runs.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CIRCLEBACK_API_KEY: ${{ secrets.CIRCLEBACK_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        run: python daily_summary.py
