<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AI27 · Usuarios, roles y permisos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F6F7F9}
a{color:#B36B00}a:hover{color:#8A5300}
.card{background:#FFFFFF;border:1px solid #E4E8ED;border-radius:10px;padding:20px;box-sizing:border-box;min-width:0}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5F6B7A;font-weight:500}
.mono{font-family:'IBM Plex Mono',monospace}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.p-ok{background:#E3F6EC;color:#17784A}.p-warn{background:#FFF1DB;color:#8A5300}.p-mute{background:#EBEEF2;color:#4A5868}.p-info{background:#E3F2F8;color:#0B6A8A}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:#5F6B7A;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid #E4E8ED;white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid #EEF1F4;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid #D5DBE3;background:#F3F5F8;color:#121821;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer;text-decoration:none}
.btn-pri{background:#F2A93B;border-color:#F2A93B;color:#17110A}
</style>
</helmet>
<div style="font-family:'IBM Plex Sans',system-ui,sans-serif;color:#121821;background:#F6F7F9;min-height:100vh;display:flex;flex-wrap:wrap">
  <div style="flex:1 1 240px;background:#FFFFFF;border-right:1px solid #EEF1F4">
    <dc-import name="Nav" active="usuarios" hint-size="100%,1100px"></dc-import>
  </div>
  <main style="flex:999 1 560px;min-width:0;padding:28px 32px 48px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">
    <header style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="lbl">Administración</span>
        <h1 style="margin:0;font-family:'Archivo',sans-serif;font-size:32px;font-weight:600">Usuarios y roles</h1>
        <span style="color:#5F6B7A;font-size:14px">58 usuarios · 9 roles · permisos por módulo, acción, zona y cliente</span>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" class="btn">Invitar usuario</button><button type="button" class="btn btn-pri">Guardar cambios</button></div>
    </header>

    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <nav aria-label="Roles" class="card" style="flex:1 1 240px;padding:10px;display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="9">
          <button type="button" onClick="{{r.pick}}" style="{{r.style}}"><span>{{r.name}}</span><span class="mono" style="font-size:12px;color:#5F6B7A">{{r.n}}</span></button>
        </sc-for>
      </nav>

      <section class="card" style="flex:999 1 560px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:4px">
            <h2 style="margin:0;font-family:'Archivo',sans-serif;font-size:20px;font-weight:600">{{role}}</h2>
            <span style="font-size:13px;color:#5F6B7A">{{roleDesc}}</span>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:#5F6B7A">Alcance por zona<select style="min-height:40px;background:#F3F5F8;border:1px solid #D5DBE3;border-radius:8px;color:#121821;padding:0 12px;font:400 14px 'IBM Plex Sans',sans-serif"><option>{{scopeZone}}</option></select></label>
            <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:#5F6B7A">Alcance por cliente<select style="min-height:40px;background:#F3F5F8;border:1px solid #D5DBE3;border-radius:8px;color:#121821;padding:0 12px;font:400 14px 'IBM Plex Sans',sans-serif"><option>{{scopeClient}}</option></select></label>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="tbl">
            <thead><tr><th>Módulo</th><th style="text-align:center">Ver</th><th style="text-align:center">Crear</th><th style="text-align:center">Editar</th><th style="text-align:center">Aprobar</th></tr></thead>
            <tbody>
              <sc-for list="{{matrix}}" as="m" hint-placeholder-count="12">
                <tr><td>{{m.mod}}</td>
                  <sc-for list="{{m.cells}}" as="c" hint-placeholder-count="4">
                    <td style="text-align:center"><label style="display:inline-flex;min-width:44px;min-height:36px;align-items:center;justify-content:center;cursor:pointer"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">{{c.aria}}</span><input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="width:18px;height:18px;accent-color:#F2A93B"></label></td>
                  </sc-for>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="card" style="display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0 0 4px;font-family:'Archivo',sans-serif;font-size:18px;font-weight:600">Bitácora de auditoría</h2>
      <sc-for list="{{audit}}" as="a" hint-placeholder-count="5">
        <div style="display:grid;grid-template-columns:140px 160px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid #EEF1F4;font-size:14px">
          <span class="mono" style="color:#5F6B7A;font-size:13px">{{a.t}}</span><span>{{a.who}}</span><span style="color:#3E4A59">{{a.what}}</span>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const mods = ['Dashboard', 'Servicios', 'Asignación IA', 'Monitoreo', 'Reacción', 'Custodios (datos sensibles)', 'Flotilla y taller', 'Cotizador', 'CRM', 'RH', 'Finanzas', 'Usuarios y roles'];
    const R = {
      'Dirección':        ['1111','1111','1111','1111','1111','1001','1001','1111','1111','1001','1111','1111'],
      'Operaciones':      ['1000','1111','1111','1110','1110','1010','1000','1000','1000','0000','0000','0000'],
      'Monitorista':      ['0000','1010','0000','1110','1100','1000','1000','0000','0000','0000','0000','0000'],
      'Reacción':         ['0000','1000','0000','1000','1111','1000','0000','0000','0000','0000','0000','0000'],
      'Flotilla / Taller':['0000','1000','0000','1000','0000','0000','1111','0000','0000','0000','1000','0000'],
      'RH':               ['0000','0000','0000','0000','0000','1111','0000','0000','0000','1111','0000','0000'],
      'Comercial':        ['1000','1100','0000','0000','0000','0000','0000','1111','1111','0000','1000','0000'],
      'Finanzas':         ['1000','1000','0000','0000','1000','0000','1000','1000','1000','0000','1111','0000'],
      'Portal cliente':   ['0000','1000','0000','1000','1000','0000','0000','0000','0000','0000','0000','0000']
    };
    const perms = {};
    Object.keys(R).forEach(k => { perms[k] = R[k].map(s => s.split('').map(c => c === '1')); });
    this.mods = mods;
    this.state = { role: 'Monitorista', perms };
  }
  renderVals() {
    const counts = { 'Dirección': 4, 'Operaciones': 9, 'Monitorista': 18, 'Reacción': 6, 'Flotilla / Taller': 5, 'RH': 4, 'Comercial': 5, 'Finanzas': 4, 'Portal cliente': 3 };
    const desc = { 'Dirección': 'Acceso total con aprobación de tarifas, gastos y altas.', 'Operaciones': 'Coordina servicios y asignaciones; acepta o cambia la sugerencia de la IA.', 'Monitorista': 'Da seguimiento en vivo, registra bitácora y escala incidentes.', 'Reacción': 'Atiende incidentes, registra recuperación y evidencias.', 'Flotilla / Taller': 'Gestiona unidades, órdenes de taller y combustible.', 'RH': 'Reclutamiento, expedientes y datos sensibles de custodios.', 'Comercial': 'Cotiza, da seguimiento a leads y administra clientes.', 'Finanzas': 'Ingresos, cuentas por cobrar, gastos y rentabilidad.', 'Portal cliente': 'El cliente ve sus servicios en vivo y sus reportes.' };
    const role = this.state.role, perms = this.state.perms;
    const acts = ['Ver', 'Crear', 'Editar', 'Aprobar'];
    return {
      roles: Object.keys(counts).map(name => ({ name, n: counts[name], pick: () => this.setState({ role: name }),
        style: 'display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;border:0;cursor:pointer;font:500 14px \'IBM Plex Sans\',sans-serif;text-align:left;' + (name === role ? 'background:#FFF1DB;color:#8A5300' : 'background:transparent;color:#2A3442') })),
      role, roleDesc: desc[role],
      scopeZone: role === 'Monitorista' ? 'Centro y Bajío' : 'Todas las zonas',
      scopeClient: role === 'Portal cliente' ? 'Solo su empresa' : 'Todos los clientes',
      matrix: this.mods.map((mod, i) => ({ mod, cells: acts.map((a, j) => ({ aria: a + ' ' + mod, on: perms[role][i][j],
        toggle: () => { const p = Object.assign({}, perms); p[role] = p[role].map(r => r.slice()); p[role][i][j] = !p[role][i][j]; this.setState({ perms: p }); } })) })),
      audit: [
        { t: '07 oct 14:02', who: 'Dirección · A. Gómez', what: 'Aprobó tarifa base Bajío: $28.50/km → $30.00/km' },
        { t: '07 oct 13:41', who: 'RH · K. May', what: 'Actualizó evaluación de confianza de C-1240' },
        { t: '07 oct 12:15', who: 'Operaciones · J. Pérez', what: 'Cambió sugerencia IA en SRV-24822 (C-0612 → C-0654)' },
        { t: '07 oct 11:58', who: 'Sistema', what: 'Alta de usuario portal cliente para Marsh' },
        { t: '06 oct 19:20', who: 'Finanzas · L. Cruz', what: 'Marcó factura F-9921 como cobrada' }
      ]
    };
  }
}
</script>
</body>
</html>
